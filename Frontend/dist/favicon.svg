<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17172B" />
      <stop offset="50%" stop-color="#121224" />
      <stop offset="100%" stop-color="#0A0A18" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="30%" stop-color="#A78BFA" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Shield Contour -->
  <path
    d="M32 4L12 11V29C12 43.5 20.5 54.8 32 60C43.5 54.8 52 43.5 52 29V11L32 4Z"
    fill="url(#shieldBg)"
    stroke="url(#shieldBorder)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Inset -->
  <path
    d="M32 9L16 15V29C16 40.5 22.8 49.8 32 54.2C41.2 49.8 48 40.5 48 29V15L32 9Z"
    stroke="rgba(139,92,246,0.3)"
    stroke-width="1.2"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Connected Charging Network Orbit Nodes -->
  <circle cx="32" cy="11" r="2" fill="#A78BFA" />
  <circle cx="16" cy="27" r="1.5" fill="#22D3EE" opacity="0.9" />
  <circle cx="48" cy="27" r="1.5" fill="#22D3EE" opacity="0.9" />
  <circle cx="32" cy="53" r="1.8" fill="#8B5CF6" />

  <!-- EV Charging Shield Core: Precision Lightning Bolt -->
  <path
    d="M35 13L21 32H31L27 51L43 29H31.5L35 13Z"
    fill="url(#boltGrad)"
    filter="url(#violetGlow)"
  />

  <!-- High-Tech Core Highlight -->
  <path
    d="M33.5 17L24.5 31H31.5L29 45L40 29.5H31L33.5 17Z"
    fill="#FFFFFF"
    opacity="0.85"
  />
</svg>
